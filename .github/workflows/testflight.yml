name: TestFlight

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  testflight:
    name: Archive, sign & upload to TestFlight
    runs-on: macos-26
    env:
      KEYCHAIN_PASSWORD: streepje-ci-ephemeral
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          BUILD_CERT_P12_BASE64: ${{ secrets.BUILD_CERT_P12_BASE64 }}
          BUILD_CERT_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISION_PROFILE_BASE64 }}
          DEVELOPMENT_TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM_ID }}
        run: |
          missing=0
          for secret in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 BUILD_CERT_P12_BASE64 BUILD_CERT_PASSWORD BUILD_PROVISION_PROFILE_BASE64 WIDGET_PROVISION_PROFILE_BASE64 DEVELOPMENT_TEAM_ID; do
            if [ -z "${!secret}" ]; then
              echo "::error::Secret '${secret}' ontbreekt — zie DEPLOY.md"
              missing=1
            fi
          done
          exit $missing

      - name: Install Apple certificate
        env:
          BUILD_CERT_P12_BASE64: ${{ secrets.BUILD_CERT_P12_BASE64 }}
          BUILD_CERT_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/streepje-signing.keychain-db
          echo -n "$BUILD_CERT_P12_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$BUILD_CERT_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install provisioning profiles (app + widget)
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          for VARNAME in BUILD_PROVISION_PROFILE_BASE64 WIDGET_PROVISION_PROFILE_BASE64; do
            PP_PATH=$RUNNER_TEMP/$VARNAME.mobileprovision
            echo -n "${!VARNAME}" | base64 --decode -o $PP_PATH
            UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i $PP_PATH)")
            cp $PP_PATH "$PP_DIR/$UUID.mobileprovision"
          done

      - name: Lees profielnamen af en toon metadata (diagnose)
        run: |
          APP_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' $RUNNER_TEMP/BUILD_PROVISION_PROFILE_BASE64.mobileprovision)
          WIDGET_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' $RUNNER_TEMP/WIDGET_PROVISION_PROFILE_BASE64.mobileprovision)
          echo "APP_PROFILE_NAME=$APP_PROFILE_NAME" >> $GITHUB_ENV
          echo "WIDGET_PROFILE_NAME=$WIDGET_PROFILE_NAME" >> $GITHUB_ENV
          for VARNAME in BUILD_PROVISION_PROFILE_BASE64 WIDGET_PROVISION_PROFILE_BASE64; do
            PLIST=$RUNNER_TEMP/$VARNAME.plist
            security cms -D -i $RUNNER_TEMP/$VARNAME.mobileprovision > $PLIST
            echo "--- $VARNAME ---"
            /usr/libexec/PlistBuddy \
              -c 'Print :Name' \
              -c 'Print :UUID' \
              -c 'Print :TeamIdentifier:0' \
              -c 'Print :ExpirationDate' \
              $PLIST
            /usr/libexec/PlistBuddy -c 'Print :Entitlements' $PLIST
          done

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p $HOME/private_keys
          echo -n "$ASC_KEY_P8_BASE64" | base64 --decode -o $HOME/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Write ExportOptions.plist
        env:
          DEVELOPMENT_TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM_ID }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<__EOF__
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${DEVELOPMENT_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>nl.pbijkerk.streepje</key><string>${APP_PROFILE_NAME}</string>
              <key>nl.pbijkerk.streepje.widgets</key><string>${WIDGET_PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          __EOF__

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Archive
        env:
          DEVELOPMENT_TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project Streepje.xcodeproj \
            -scheme Streepje \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/Streepje.xcarchive \
            APP_PP_SPECIFIER="$APP_PROFILE_NAME" \
            WIDGET_PP_SPECIFIER="$WIDGET_PROFILE_NAME" \
            DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM_ID \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            MARKETING_VERSION=${GITHUB_REF_NAME#v} \
            CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Streepje.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath $HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            -f $RUNNER_TEMP/export/Streepje.ipa \
            --apiKey $ASC_KEY_ID \
            --apiIssuer $ASC_ISSUER_ID
