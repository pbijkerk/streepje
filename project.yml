name: Streepje
options:
  bundleIdPrefix: nl.pbijkerk
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: nl
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Streepje:
    type: application
    platform: iOS
    sources:
      - path: Streepje
    info:
      path: Streepje/Info.plist
      properties:
        NSCameraUsageDescription: Streepje gebruikt de camera om streepjescodes van producten te scannen.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.pbijkerk.streepje
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  StreepjeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StreepjeTests
    dependencies:
      - target: Streepje
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.pbijkerk.streepjeTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Streepje:
    build:
      targets:
        Streepje: all
        StreepjeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StreepjeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
